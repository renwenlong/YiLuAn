# Grafana datasource provisioning — staging (S2-OPS-010)
# 自动配置 Prometheus 数据源，UID 固定 'prometheus' 便于 dashboard JSON 复用
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: GET
