# =============================================================================
# S3-OPS-CANARY-REAL-YAML-PATH-ENV — canary 真实灰度白名单 (real list)
# 魈 2026-06-23 方案 b: 与 mock whitelist_phones.yaml 物理隔离 (§20 约定)
# =============================================================================
#
# 用途:
#   生产 canary 容器设 CANARY_WHITELIST_PATH=whitelist_phones.real.yaml 时,
#   canary_whitelist.load() 读本文件而非 mock yaml。真实灰度上线
#   (S2-OPS-A-REAL-LAUNCH) 切量时用,承载真号; mock yaml 仍供本地/staging。
#
# 为什么独立文件 (不覆盖 mock yaml):
#   - mock/real 物理隔离, 避免真号顶掉 mock 占位 (whitelist_phones.yaml §20)
#   - 回退只需改 1 个 env (CANARY_WHITELIST_PATH 切回 mock), 不动文件
#   - real 名单独立 git history, audit/blame 清晰
#
# 维护流程 (真号填充):
#   1. 帝君指派 5-10 公司同事手机号 -> PM (凝光) 收齐
#   2. 凝光同步真号给胡桃 -> 胡桃 sed/edit 替换 __PENDING_* / __PLACEHOLDER_*
#      占位符 -> PR (走 review)
#   3. 真号填充前本文件全 placeholder, load() 解析时 placeholder 被跳过
#      (__PENDING_ / __PLACEHOLDER_ 前缀), 等价空名单 -> 灰度不放量 (fail-safe)
#
# 编辑约定 (同 mock yaml):
#   - 真手机号 11 位, 字符串引号包裹 (避免 yaml int)
#   - role 标注 (Owner/PM/architect/developer/tester/coordinator/colleague_NN)
#   - 注释说明谁加 + 日期 (audit 留痕)
#   - 移除走 git revert 不直接删行 (留痕)
#
# ⚠️⚠️ 当前状态: DRY-RUN 占位号 (13800000001~05, 非真号/非真实可达)。
#    team/colleagues 号重复仅因帝君示意基底相同 (138 尾号 1-5)。
#    本填充仅为验证 real.yaml 路径切换 + load() 解析 + gate 放行机制走通
#    (S2-OPS-A-REAL-LAUNCH dry-run, 凝光派, 帝君方案 B 2026-06-24)。
#    ❗真上线 (REAL-LAUNCH gate-ON 切真流量) 前必须替换为 10 个不同真号❗
#    dry-run 下重复号无害 (gate 按号匹配放行, frozenset 自动去重)。
#
# 相关:
#   - docs/ops/canary-deployment.md §2.3 团队内部测试用户白名单
#   - S3-OPS-CANARY-REAL-YAML-PATH-ENV / S2-OPS-A-REAL-LAUNCH (taskboard)
#   - deploy/canary/whitelist_phones.yaml (mock, §20 隔离约定来源)
# =============================================================================

