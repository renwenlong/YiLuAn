# =============================================================================
# S2-OPS-A-REAL-LAUNCH — canary 真实灰度白名单 (real list, phone_env 注入)
# 凝光 Q2=a 2026-06-29: yaml 仅存掩码(审计), 真号走 phone_env → encrypted secret
# =============================================================================
#
# 用途:
#   生产 canary 容器设 CANARY_WHITELIST_PATH=whitelist_phones.real.yaml 时,
#   canary_whitelist.load() 读本文件而非 mock yaml。每条 entry 的真号由
#   phone_env 字段命名的环境变量注入 (1 ENV = 1 真号), yaml phone 仅掩码。
#
# 新机制 (phone_env, = 老机制超集):
#   - entry 有 phone_env → load() 从该 ENV 读真号, yaml phone 当掩码不读
#   - entry 无 phone_env → 老路径读 phone (mock yaml 向后兼容)
#   - ENV 未注入 / 注入 __PENDING_/__PLACEHOLDER_ → 该 entry fail-safe 跳 (不放量)
#   - 单条故障松耦合, 不靠跨 entry 顺序/列表对齐
#
# 掩码格式:
#   前3 + **** + 后4 (11 字符), 后4 明文对账 + 前3 运营商粗判, 公开 OK。
#   真号绝不入 git/yaml/log/comment — 仅 encrypted secret + runtime ENV。
#
# ENV 命名 (10 真号):
#   team:       REAL_PHONE_TEAM_{PM,ARCH,DEV,TEST,COORD}
#   colleagues: REAL_PHONE_COLLEAGUE_{1..5}
#
# 维护流程:
#   1. 帝君指派 10 真号 → PM 凝光收齐 → 物流到 encrypted secret (帝君 Q3 拍路径)
#   2. PM 把后4位掩码同步胡桃 → 胡桃填 yaml phone 掩码 (PR 走 review)
#   3. 注入前掩码占位 ___****____, frozenset 空, gate fail-safe 不放量
#
# 相关:
#   - docs/ops/canary-deployment.md §2.3 团队内部测试用户白名单
#   - S2-OPS-A-REAL-LAUNCH / S3-OPS-CANARY-REAL-YAML-PATH-ENV (taskboard)
#   - deploy/canary/whitelist_phones.yaml (mock, §20 物理隔离约定)
# =============================================================================

