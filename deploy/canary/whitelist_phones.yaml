# =============================================================================
# S2-OPS-A-CANARY-WHITELIST-LAUNCH AC-1
# 内部白名单 10% mock 灰度上线 — 白名单手机号清单 (帝君 06-08 03:21 UTC 拍 A)
# =============================================================================
#
# 用途:
#   F2 入口开关按 phone in whitelist 生效 (OrderPrecheckAggregator 前置过滤
#   + 后端 ABAC 兜底). 白名单内手机号 -> 看到 F2 入口; 白名单外 -> 看不到.
#
# 控制爆炸半径:
#   AC-1 要求 <=20 人. 当前 5 团队成员 + 1 sentinel 占位 + 帝君指派 5-10
#   公司同事 = 11-16 人.
#
# 维护流程:
#   1. 帝君指派 5-10 个公司同事手机号 -> PM (凝光) 收齐 -> 同步给胡桃
#   2. 胡桃 sed 替换 colleague_* 占位符 (`sed -i 's/13___PLACEHOLDER_01__/<phone>/'`)
#      或直接 edit 后 PR
#   3. backend 启动时由 settings 加载 + redis 缓存 (S2-OPS-A-CANARY-* 后续
#      F2 开关 implement)
#   4. 灰度推 real 物料路径时另起独立 yaml (deploy/canary/whitelist_phones.real.yaml)
#      避免 mock / real 串
#
# 编辑约定:
#   - 真手机号 11 位, 字符串引号包裹 (避免 yaml int)
#   - role 标注用 (Owner / PM / architect / developer / tester / coordinator /
#     colleague_NN), 便于日后梳理
#   - 加注释说明谁加进来 + 加的日期 (audit 留痕)
#   - 移除某人时 git revert 不要直接删行 (留痕)
#
# 相关文档:
#   - docs/ops/canary-deployment.md §2.3 流量前置 "团队内部测试用户白名单"
#   - S2-OPS-A-CANARY-WHITELIST-LAUNCH (taskboard)
# =============================================================================

