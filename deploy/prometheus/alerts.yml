groups:
  - name: yiluan_alerts
    rules:
      # 1. Outbound call failure rate > 20% over 5 min
      - alert: OutboundFailureRateHigh
        expr: >
          (
            sum(rate(outbound_call_total{outcome!="success"}[5m]))
            /
            sum(rate(outbound_call_total[5m]))
          ) > 0.2
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "Outbound call failure rate exceeds 20%"
          description: "Outbound failure rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      # 2. Circuit breaker open for any provider
      - alert: CircuitBreakerOpen
        expr: outbound_circuit_breaker_state == 1
        for: 1m
        labels:
          severity: P1
        annotations:
          summary: "Circuit breaker OPEN for provider {{ $labels.provider }}"
          description: "Provider {{ $labels.provider }} circuit breaker has been open for >1 min."

      # 3. Order creation rate drop > 80% vs 1h ago
      - alert: OrderCreationDrop
        expr: >
          (
            sum(rate(order_created_total[5m]))
            /
            sum(rate(order_created_total[5m] offset 1h))
          ) < 0.2
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "Order creation rate dropped >80% vs 1h ago"
          description: "Current order creation rate is {{ $value | humanizePercentage }} of the rate 1 hour ago."

      # 4. Payment callback failure rate > 10%
      - alert: PaymentCallbackFailureRateHigh
        expr: >
          (
            sum(rate(payment_callback_received_total{status="failed"}[5m]))
            /
            sum(rate(payment_callback_received_total[5m]))
          ) > 0.1
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "Payment callback failure rate exceeds 10%"
          description: "Payment callback failure rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      # 5. Readiness probe failing
      - alert: ReadinessProbeFailure
        expr: probe_success{job="yiluan-readiness"} == 0
        for: 2m
        labels:
          severity: P0
        annotations:
          summary: "Readiness probe failing for >2 min"
          description: "The /readiness endpoint has been returning non-200 for over 2 minutes."

      # 6. AI budget soft warning (90%+ daily budget used) — info severity
      #    PR #228 / S3-DEV-002-BUDGET-GUARD / ADR-0048 §3.2 fire_alert prom-native path
      - alert: AIBudgetSoftWarning
        expr: |
          sum by (axis) (rate(ai_budget_threshold_alerts_total{severity="info"}[5m])) > 0
        for: 1m
        labels:
          severity: P2
        annotations:
          summary: "AI budget axis {{ $labels.axis }} hit 90% soft threshold"
          description: "AIBudgetGuard fired ``info`` severity threshold alert for axis {{ $labels.axis }} — daily budget at 90%+ but still ALLOW. 监控用量趋势 + 准备扩容或调降 limit."

      # 7. AI budget exhausted (100%+ daily budget used) — warning severity, immediate ops attention
      #    PR #228 / S3-DEV-002-BUDGET-GUARD / ADR-0048 §3.2 fire_alert prom-native path
      - alert: AIBudgetExhausted
        expr: |
          sum by (axis) (rate(ai_budget_threshold_alerts_total{severity="warning"}[5m])) > 0
        for: 1m
        labels:
          severity: P1
        annotations:
          summary: "AI budget axis {{ $labels.axis }} EXHAUSTED — calls being REJECTed"
          description: "AIBudgetGuard fired ``warning`` severity threshold alert for axis {{ $labels.axis }} — daily budget 100%+ used, calls returning REJECT + fallback template. 用户感知降级 / 需扩 daily budget 或限流上游."

      # 8. AI budget reject rate high (sustained reject = upstream 异常 / config bug)
      #    PR #228 derived: 用 ai_budget_check_total result label 监控 reject ratio
      - alert: AIBudgetRejectRateHigh
        expr: |
          (
            sum by (axis) (rate(ai_budget_check_total{result="reject"}[5m]))
          ) /
          (
            sum by (axis) (rate(ai_budget_check_total[5m])) > 0
          ) > 0.5
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "AI budget axis {{ $labels.axis }} reject rate >50% over 5 min"
          description: "AIBudgetGuard reject rate for axis {{ $labels.axis }} is {{ $value | humanizePercentage }}. 可能原因: daily budget 用完 / redis 不可用 / config error. 查 ai_budget_threshold_alerts_total + redis 健康."
