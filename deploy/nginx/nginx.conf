user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream backend_staging {
        server backend:8000;
    }
    upstream mock_pay {
        server mock-pay-stub:8001;
    }
    upstream mock_sms {
        server mock-sms-stub:8002;
    }

    server {
        listen 80;
        server_name _;

        # Backend API
        location /api/ {
            proxy_pass         http://backend_staging;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # WebSocket under /api/v1/ws/* (e.g. /api/v1/ws/notifications)
        # 必须在 /api/ 之后不同的 prefix，由 nginx 最长前缀匹配接过去，带 Upgrade 头。
        location /api/v1/ws/ {
            proxy_pass         http://backend_staging;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # Health passthrough
        location = /health {
            proxy_pass http://backend_staging/health;
        }
        location = /readiness {
            proxy_pass http://backend_staging/readiness;
        }

        # WebSocket
        location /ws/ {
            proxy_pass         http://backend_staging;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_read_timeout 3600s;
        }

        # Staging-only debug routes for host-side e2e/replay scripts.
        # These proxy directly to the mock stub admin/control endpoints
        # so the rehearsal driver can run from the host without entering
        # the Docker network.
        location /__staging/mock-pay/ {
            proxy_pass http://mock_pay/;
            proxy_set_header Host $host;
        }
        location /__staging/mock-sms/ {
            proxy_pass http://mock_sms/;
            proxy_set_header Host $host;
        }

        # Admin H5 static site (D-044 staging convenience).
        # Served at /admin/ to mirror future production layout. Static files
        # are mounted read-only from the repo via docker-compose.
        location /admin/ {
            alias /usr/share/nginx/admin-h5/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
            add_header Cache-Control "no-store";
        }

        # Default landing
        location / {
            return 200 'yiluan-staging\n';
            add_header Content-Type text/plain;
        }
    }
}
