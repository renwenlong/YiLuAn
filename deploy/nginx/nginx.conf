user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream backend_staging {
        server backend:8000;
    }
    upstream mock_pay {
        server mock-pay-stub:8001;
    }
    upstream mock_sms {
        server mock-sms-stub:8002;
    }

    server {
        listen 80;
        server_name _;

        # Backend API
        location /api/ {
            proxy_pass         http://backend_staging;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # WebSocket under /api/v1/ws/* (e.g. /api/v1/ws/notifications)
        # 必须在 /api/ 之后不同的 prefix，由 nginx 最长前缀匹配接过去，带 Upgrade 头。
        location /api/v1/ws/ {
            proxy_pass         http://backend_staging;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # Health passthrough
        location = /health {
            proxy_pass http://backend_staging/health;
        }
        location = /readiness {
            proxy_pass http://backend_staging/readiness;
        }

        # WebSocket
        location /ws/ {
            proxy_pass         http://backend_staging;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_read_timeout 3600s;
        }

        # Staging-only debug routes for host-side e2e/replay scripts.
        # These proxy directly to the mock stub admin/control endpoints
        # so the rehearsal driver can run from the host without entering
        # the Docker network.
        location /__staging/mock-pay/ {
            proxy_pass http://mock_pay/;
            proxy_set_header Host $host;
        }
        location /__staging/mock-sms/ {
            proxy_pass http://mock_sms/;
            proxy_set_header Host $host;
        }

        # Admin H5 static site (D-044 staging convenience).
        # Served at /admin/ to mirror future production layout. Static files
        # are mounted read-only from the repo via docker-compose.
        location /admin/ {
            alias /usr/share/nginx/admin-h5/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
            add_header Cache-Control "no-store";
        }

        # S2-DEV-013 PR-C: admin-v2 React SPA 与 v1 共存。
        # admin-v2/dist/ 在 docker-compose admin-v2-build 中生成后 mount.
        # SPA history fallback: try_files 未命中静态资源 → index.html（react-router）。
        # 静态资源加 immutable cache，index.html no-store 防版本漂移。

        # 静态资源 prefix location (凝光 PR-C 部署发现 alias path doubling bug fix):
        # 原 regex location + alias 会拼出 /usr/share/nginx/admin-v2/admin-v2/assets/...
        # 改 prefix location + alias 是 nginx 标准用法，路径正确拼接。
        # Vite build 所有产物默认走 /admin-v2/assets/, 覆盖 95%+ 场景。
        location /admin-v2/assets/ {
            alias /usr/share/nginx/admin-v2/assets/;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # SPA history fallback: 未命中静态资源也不是 index.html → fallback 到 index.html
        location /admin-v2/ {
            alias /usr/share/nginx/admin-v2/;
            index index.html;
            try_files $uri $uri/ /admin-v2/index.html;
        }
        location = /admin-v2/index.html {
            alias /usr/share/nginx/admin-v2/index.html;
            add_header Cache-Control "no-store";
        }

        # 任何未映射的 /static/* 以推路径 ×。10 三类 ( § acceptance) 需要显示 404 避免 上游为安全检联提进 "位置=未暴露"；cert image 真路径 = /api/v1/admin/companions/certification-images/<filename>?sig=<HMAC>，走 backend 不走 nginx static 。防谍别人猜測 "/static/cert/" 能拿原始文件。
        location ~* ^/static/ {
            return 404;
        }

        # ADR-0044 r1 §4.2 闸 4（S2-DEV-013-PR-E2-FOLLOWUP-DOUBLE-GATE acceptance #7）：
        # 显式拒裸 GET backend private 证件目录。该目录不应被 nginx 映射，但显式 404
        # 防御构造路径 (/private/certification-images/abc.jpg) 探测后端文件系统布局。
        # 真路径仅走 /api/v1/admin/companions/certification-images/<filename>?expires=&sig=
        # （双闸：require_admin + HMAC，见 backend public_certification_images_router）。
        location ~* ^/private/ {
            return 404;
        }

        # Default landing
        location / {
            return 200 'yiluan-staging\n';
            add_header Content-Type text/plain;
        }
    }
}
