# YiLuAn 通用部署编排（多环境共用骨架）
#
# 设计：单一 docker-compose.yml + env.<环境> 配置文件。
#   切环境只需换 --env-file，不改 compose 本身。
#
# 用法（从 deploy/ 目录，由 up.sh / up.ps1 封装）：
#   staging:    docker compose --env-file env.staging [--env-file env.staging.local] \
#                 --profile staging up -d --build
#
# 本地密钥覆盖（staging）：
#   env.staging 入库放假值；env.staging.local（gitignore）放真值，
#   作为第二个 --env-file 叠加，后者覆盖前者。
#
# 多环境说明：
#   * 本骨架服务 staging / canary / production（单一 compose + profile 切换）。
#   * 项目名（name）与宿主端口当前写死为 staging 值（帝君决策 ④：先不参数化）。
#   * env.production.example 为将来扩 production 时的配置模板预留。
#
# profiles:
#   * pg / redis 是基础服务，属于全部 profile（staging/canary/production）。
#   * mock-pay-stub / mock-sms-stub 在 `staging` 和 `canary` profile 下启用；
#     生产不激活该 profile → 不会起 mock。
#   * canary profile (S2-OPS-013)：mock 链路完整闭环 (帝君拍板不申请真物料)。
#     用 --env-file env.staging --env-file env.canary 叠加; up.sh canary 自动 -p yiluan-canary 隔离 volume/container。
#
# Network:
#   * staging/production：仅 nginx 暴露宿主端口；其余只在内部网络可达。

name: yiluan-staging

services:
  pg:
    image: postgres:15-alpine
    profiles: ["staging", "canary", "production"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 端口绑定由 env.<环境> 的 PG_HOST_PORT/PG_HOST_BIND 控制：
    #   staging/production 设高位口（15432）→ 实际仅内部网络访问
    ports:
      - "${PG_HOST_BIND:-127.0.0.1}:${PG_HOST_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - yiluan-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["staging", "canary", "production"]
    # staging/production 设高位口 16379
    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-16379}:6379"
    networks:
      - yiluan-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-pay-stub:
    profiles: ["staging", "canary"]
    build:
      context: ./mock-pay-stub
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      PAY_CALLBACK_PATH: /api/v1/payments/wechat/callback
    networks:
      - yiluan-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5

  mock-sms-stub:
    profiles: ["staging", "canary"]
    build:
      context: ./mock-sms-stub
      dockerfile: Dockerfile
    networks:
      - yiluan-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/health',timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      # S3-BUG-003: context 调到 repo 根 (原 ../backend), Dockerfile 路径加 backend/ 前缀.
      # 原因: 需要 COPY docs/medical-content/ 进 image, 不能限于 backend/ 子目录.
      context: ..
      dockerfile: backend/Dockerfile
    profiles: ["staging", "canary", "production"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DEBUG: ${DEBUG}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
      SMS_PROVIDER: ${SMS_PROVIDER}
      MOCK_PAY_BASE_URL: ${MOCK_PAY_BASE_URL:-}
      MOCK_SMS_BASE_URL: ${MOCK_SMS_BASE_URL:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      WS_PUBSUB_ENABLED: ${WS_PUBSUB_ENABLED:-true}
      # S3-DEV-001 / ADR-0046 §3.2: contract patient pseudonym salt。
      # ContractService.request_generation 哨兵读空报 ContractPseudonymSaltMissingError。
      # 任何 profile (staging/canary/production) 都走同一套 backend image，故三者都需要 passthrough.
      CONTRACT_PSEUDONYM_SALT: ${CONTRACT_PSEUDONYM_SALT:-}
      # S3-OPS-DEPLOY-PII-SECRETS-AUDIT (ADR-0029 §3): emergency PII envelope 加密 + phone hash salt。
      # 不 passthrough = backend 走 config.py fallback default → PIPL 反查暴露。
      # config.py validate_secrets_for_environment 在 prod env 会 fail-fast 拒默认值。
      PII_HASH_SALT: ${PII_HASH_SALT:-}
      PII_ENVELOPE_KEY: ${PII_ENVELOPE_KEY:-}
      # S3-BUG-003: AI blocklist startup strict load (运维 env opt-in fail-loud).
      # True 时缺 prohibited-keywords.yml 拒启。env.staging/canary/production 都设 true.
      AI_BLOCKLIST_STRICT_LOAD: ${AI_BLOCKLIST_STRICT_LOAD:-false}
      # S2-OPS-A-CANARY-WHITELIST-LAUNCH: canary 灰度白名单 gate 总开关。
      # config.py canary_whitelist_enabled default False—不 passthrough = 容器读不到 env.canary.local 的 true。
      # :-false 兑底：staging/dev/production 不设此变量时 gate 仍关，不破坏其他 profile 基线。
      CANARY_WHITELIST_ENABLED: ${CANARY_WHITELIST_ENABLED:-false}
      # S2-OPS-A-REAL-LAUNCH: canary 白名单 yaml 路径 (mock vs real 切换)。
      # config.py canary_whitelist_path default "whitelist_phones.yaml" (mock)—不 passthrough
      # = 容器读不到 env.canary 的 real.yaml 路径 → 真号灯灰度加载不到 real list (退回 mock)。
      # canary_whitelist.py _resolve_yml_path() 读此 env 切 whitelist_phones.real.yaml。
      # :-whitelist_phones.yaml 兜底：staging/dev/production 不设时走 mock yaml, 不破坏其他 profile 基线。
      CANARY_WHITELIST_PATH: ${CANARY_WHITELIST_PATH:-whitelist_phones.yaml}
      # S2-OPS-A-REAL-LAUNCH: canary 真号白名单 13 槽 passthrough (team5 + colleague8)。
      # whitelist_phones.real.yaml 用 phone_env 机制 (yaml 存 env 名, 运行时 os.environ.get 读值)。
      # compose environment 白名单式逐列, 不 passthrough = 容器读不到 env.canary.local 真号 →
      # real.yaml phone_env fail-safe skip 所有真号 → frozenset 只剩 sentinel (真号灰度空)。
      # :- 兜底空: staging/dev/production 不设时为空, phone_env 机制 skip 空值, 不破坏其他 profile (gate 仍可 fail-closed)。
      # profile 隔离: 逐列 + 兜底空 比 env_file 整体注入更干净 (env_file 指 canary.local 会让 staging/production 误加载真号)。
      REAL_PHONE_TEAM_PM: ${REAL_PHONE_TEAM_PM:-}
      REAL_PHONE_TEAM_ARCH: ${REAL_PHONE_TEAM_ARCH:-}
      REAL_PHONE_TEAM_DEV: ${REAL_PHONE_TEAM_DEV:-}
      REAL_PHONE_TEAM_TEST: ${REAL_PHONE_TEAM_TEST:-}
      REAL_PHONE_TEAM_COORD: ${REAL_PHONE_TEAM_COORD:-}
      REAL_PHONE_COLLEAGUE_1: ${REAL_PHONE_COLLEAGUE_1:-}
      REAL_PHONE_COLLEAGUE_2: ${REAL_PHONE_COLLEAGUE_2:-}
      REAL_PHONE_COLLEAGUE_3: ${REAL_PHONE_COLLEAGUE_3:-}
      REAL_PHONE_COLLEAGUE_4: ${REAL_PHONE_COLLEAGUE_4:-}
      REAL_PHONE_COLLEAGUE_5: ${REAL_PHONE_COLLEAGUE_5:-}
      REAL_PHONE_COLLEAGUE_6: ${REAL_PHONE_COLLEAGUE_6:-}
      REAL_PHONE_COLLEAGUE_7: ${REAL_PHONE_COLLEAGUE_7:-}
      REAL_PHONE_COLLEAGUE_8: ${REAL_PHONE_COLLEAGUE_8:-}
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yiluan-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ping',timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    profiles: ["staging", "canary", "production"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # NGINX_HOST_PORT：staging=18080，canary=18090（env 错开避撞），production=80
      - "${NGINX_HOST_BIND:-127.0.0.1}:${NGINX_HOST_PORT:-18080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../admin-h5:/usr/share/nginx/admin-h5:ro
      # S2-DEV-013 PR-C: admin-v2 React SPA dist mount。
      # 占位 ./placeholder-admin-v2-dist 文件夹避免 nginx 启动报 源不存在。
      # 实际部署前 OPS 在主 tree 跑 cd admin-v2 + npm install + npm run build
      # 产生 admin-v2/dist/, 该路径下最终 mount 到容器内 /usr/share/nginx/admin-v2/
      # 如 dist 不存在 nginx 仍可起动（/admin-v2/ 路径返 404）不阻断其他服务。
      # 详 docs/ops/admin-v2-deployment.md
      - ../admin-v2/dist:/usr/share/nginx/admin-v2:ro
    networks:
      - yiluan-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------
  # S2-OPS-010: Prometheus + Alertmanager + Grafana + alertmanager-webhook
  # 跟 S2-TEST-004 火度门硬约束走，会被 staging profile 拉起。
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["staging", "canary"]
    ports:
      - "${PROM_HOST_BIND:-127.0.0.1}:${PROM_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - ./prometheus/yiluan-canary.yml:/etc/prometheus/rules/yiluan-canary.yml:ro
      - prom-data:/prometheus
    networks:
      - yiluan-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["staging", "canary"]
    ports:
      - "${AM_HOST_BIND:-127.0.0.1}:${AM_HOST_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - am-data:/alertmanager
    networks:
      - yiluan-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  alertmanager-webhook:
    build:
      context: ../ops/alertmanager
    profiles: ["staging", "canary"]
    networks:
      - yiluan-net
    environment:
      WECHAT_WORK_WEBHOOK_URL: ${WECHAT_WORK_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://127.0.0.1:5001/healthz',timeout=2).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["staging", "canary"]
    ports:
      # avoid 3000 (common local port; agent-squad / Next.js / Grafana defaults
      # all bind there). 13000 keeps the "1xxxx staging" convention with 18080.
      # canary 用 13001 错开 staging。
      - "${GRAFANA_HOST_BIND:-127.0.0.1}:${GRAFANA_HOST_PORT:-13000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../ops/grafana/yiluan-overview.json:/var/lib/grafana/dashboards/yiluan-overview.json:ro
      - ../ops/grafana/yiluan-canary.json:/var/lib/grafana/dashboards/yiluan-canary.json:ro
      - grafana-data:/var/lib/grafana
    networks:
      - yiluan-net
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  yiluan-net:
    driver: bridge

volumes:
  pgdata:
  prom-data:
  am-data:
  grafana-data:
