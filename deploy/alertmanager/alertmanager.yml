# =============================================================================
# YiLuAn Alertmanager config — staging (S2-OPS-010)
# -----------------------------------------------------------------------------
# 路由：所有 P0/P1 告警走 wechat-work-webhook（ops/alertmanager/）
# webhook 进程是同 compose 网络的 alertmanager-webhook:5001 服务。
# 真正落到企业微信群机器人的 secret 由 env.staging.local 注入。
# =============================================================================

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 1h
  receiver: 'wechat-work-default'
  routes:
    # P0 告警立即触发 + 不抑制
    - matchers:
        - severity = "P0"
      receiver: 'wechat-work-p0'
      group_wait: 0s
      repeat_interval: 15m
    # P1 告警按 alertname 分组
    - matchers:
        - severity = "P1"
      receiver: 'wechat-work-p1'
      group_interval: 5m
      repeat_interval: 30m

receivers:
  - name: 'wechat-work-default'
    webhook_configs:
      - url: 'http://alertmanager-webhook:5001/alert?channel=default'
        send_resolved: true

  - name: 'wechat-work-p0'
    webhook_configs:
      - url: 'http://alertmanager-webhook:5001/alert?channel=p0'
        send_resolved: true

  - name: 'wechat-work-p1'
    webhook_configs:
      - url: 'http://alertmanager-webhook:5001/alert?channel=p1'
        send_resolved: true

# 抑制规则：P0 触发时同 alertname 的 P1 不发
inhibit_rules:
  - source_matchers:
      - severity = "P0"
    target_matchers:
      - severity = "P1"
    equal: ['alertname']
