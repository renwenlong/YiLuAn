# YiLuAn dev 本地开发栈：只起 db + redis。
#
# 后端用 uvicorn 直接裸跑（热重载，改代码即生效，不 rebuild 镜像）——
# 这是日常迭代最快的方式（魈三号决策 b 路线）。
# 全栈容器化部署见 ../docker-compose.yml + ../up.sh（staging/production）。
#
# ⚠ 端口避开 agent-squad 占用的 5432/6379，改用 5433/6380。
#    本地 backend 的 DATABASE_URL/REDIS_URL 需指向这些端口（见 env.dev.example / README 方式一）。
#
# 用法（从 deploy/dev 目录，或用 ../up.sh dev 封装）：
#   docker compose --env-file env.dev -p yiluan-dev -f docker-compose.yml up -d
#   docker compose -p yiluan-dev -f docker-compose.yml down       # 停
#   docker compose -p yiluan-dev -f docker-compose.yml down -v    # 停并清数据

name: yiluan-dev

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-yiluan}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
