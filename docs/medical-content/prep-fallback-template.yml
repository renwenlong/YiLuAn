# Preparation Package Fallback Template
#
# 用途: 当 AI 生成失败时(预算耗尽/L1 输入拦截/L2 输出拦截/LLM 错误),
# 系统降级使用本通用模板内容填充 preparation_packages, 标记
# status=active_fallback_template + fallback_reason=<原因>.
#
# Reference:
# - ADR-0048-ai-prep-budget-guard-prompt-versioning §8 P3
# - PRD-001 v1.4 §F8 + PRD-003 v0.5 §4 (AI 准备包)
# - S3-DEV-002-PREP-GENERATE-WITH-BUDGETGUARD (PR #243) acceptance criterion 3
# - S3-DEV-002-PREP-FALLBACK-TEMPLATE-V1 (PM PR 本文件 v1.0.0 升级)
# - docs/qa/s3-ai-prep-blocklist-v1.md (PM 06-06 落禁区关键词清单, 本模板已对照过滤)
#
# !! 维护约束 !!
# - 4 块字段(carry_items / pre_visit_notes / possible_questions /
#   companion_focus_points)必须 1:1 对齐 PreparationPackage model
# - 内容**不可包含医疗建议字样**(诊断 / 治疗 / 用药 / 剂量 / 用药调整)
# - 内容**通用**(不绑定具体科室/疾病/人群)
# - 内容**不暴露可识别病情/姓名/身份证/电话**(ABAC 合规, 复用 PREP-API §7.0)
# - 禁词清单(docs/qa/s3-ai-prep-blocklist-v1.md §1 6 大类): 诊断/用药/治疗/检查解读/预后/隐私敏感
#
# 版本变更:
# - v0.1.0-mvp (2026-06-10, hutao): S3-DEV-002-PREP-GENERATE-WITH-BUDGETGUARD 实现期 minimal 占位
# - v1.0.0 (2026-06-10, ningguang): PM 升级为正式版, 4 块文案补全 + 拓展性增强 + 医疗顾问 review 预留 placeholder

