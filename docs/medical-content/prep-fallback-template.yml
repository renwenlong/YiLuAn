# 患者随身携带物品清单 (通用就诊基础物品)
carry_items:
  - "身份证 (社保需要)"
  - "医保卡或社保卡 (报销结算)"
  - "既往病历资料 (纸质或电子, 含历次就诊记录)"
  - "近期检查报告 (化验单 / 影像片, 3 个月内)"
  - "目前使用中的药品清单 (可拍照备份)"
  - "现金或常用支付方式 (部分诊室 / 服务窗口仅支持现金)"
  - "纸笔或手机备忘 (便于记录医嘱要点)"
  - "口罩 (医院常态要求)"
  - "暖水杯 / 充电宝 (候诊较长备用)"
  - "病历本 (医院如有要求)"

# 就诊前注意事项 (通用准备建议)
pre_visit_notes: |
  以下是通用就诊准备建议, 仅供参考, 不构成医疗建议:

  **1. 时间安排**
  - 提前 30-60 分钟到达医院, 预留挂号 / 缴费 / 找诊室时间
  - 高峰期 (上午 9-11 点 / 下午 2-4 点) 候诊可能较长, 预留更多时间

  **2. 资料准备**
  - 整理本次就诊主要关切问题, 可写在纸上避免遗忘
  - 准备好基础信息: 起病时间 / 持续多久 / 加重或缓解因素 / 既往就诊经历
  - 如有过敏史 / 慢性病史 / 重大手术史, 主动告知医生

  **3. 候诊期间**
  - 关注叫号系统, 避免错过
  - 如需做影像检查或抽血等, 请按医院预约单上指引提前空腹或饮水
  - 候诊期间避免食用影响检查的食物或饮料 (如医院事先要求)

  **4. 就诊互动**
  - 主动配合医生询问, 如实回答病情情况
  - 不清楚的地方及时问医生, 不要不好意思
  - 重要内容当场记录或请陪诊师协助记录

  **5. 离院前**
  - 确认是否需要后续复查 / 预约下次就诊
  - 拿齐所有处方 / 检查单 / 缴费票据
  - 询问医生注意事项及联系方式

  *本内容为通用提示, 不构成医疗建议. 具体准备请遵医嘱或咨询医生.*

# 就诊时可能被问到的问题 (通用问诊问题, 帮助患者提前组织语言)
possible_questions:
  - "目前主要不适是什么时候开始的?"
  - "症状是持续出现还是间歇性的? 频率如何?"
  - "症状的强度大概是怎样的? (如轻微/明显/严重)"
  - "什么情况下加重, 什么情况下缓解?"
  - "之前是否因为类似情况就诊过? 当时医生说了什么?"
  - "之前是否用过相关治疗或药物? 效果如何?"
  - "家族中是否有人有过类似情况?"
  - "近期生活作息 / 饮食 / 工作 / 情绪是否有明显变化?"
  - "是否有过敏史? 对哪些药物或食物过敏?"
  - "目前是否正在使用其他药物或保健品?"
  - "近期是否有手术 / 重大检查 / 或其他就诊经历?"

# 陪诊师重点关注事项 (本字段只给陪诊师看, ABAC 4 层防御保护)
companion_focus_points:
  - "协助患者按时到达医院、找到诊室"
  - "记录医生当次诊断要点、检查项目、用药指导 (注意: 仅记录医生明示的内容, 不替代医生判断)"
  - "提醒患者向医生反馈所有关切问题, 避免遗漏"
  - "陪同完成检查 / 缴费 / 取药全流程"
  - "如医生开出后续复查或检查单, 协助预约登记"
  - "如医生有口头注意事项 (如饮食 / 复诊时间), 记录并提醒患者"
  - "为患者整理本次就诊记录, 便于后续追踪 (脱敏处理)"
  - "服务结束后通过平台 admin 反馈本次就诊体验, 不在本字段对接患者沟通医疗建议"
