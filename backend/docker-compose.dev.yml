# 本地开发用轻量栈：只起 db + redis，供本地直接运行后端 (uvicorn --reload) 联调 / 跑需要真实 PG/Redis 的测试。
#
# 全栈部署（api + nginx + mock stub 等）已迁移到 deploy/docker-compose.yml（按 --env-file 切环境），
# 见 README §部署 与 deploy/up.sh。本文件刻意不含 api 容器——本地后端用 uvicorn 直接跑，热重载更快。
#
# ⚠ 端口避开 agent-squad 占用的 5432/6379，改用 5433/6380。
# 本地 .env 的 DATABASE_URL/REDIS_URL 需指向这些端口（见 README 方式一）。
#
# 用法：
#   cd backend
#   docker compose -f docker-compose.dev.yml up -d        # 起 db + redis
#   docker compose -f docker-compose.dev.yml down          # 停
#   docker compose -f docker-compose.dev.yml down -v       # 停并清数据
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yiluan
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
