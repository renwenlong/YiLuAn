# [S2-DEV-005] AI summary post-check blocklist.
#
# 命中任意 phrase → 该次摘要降级为模板文案，metric
# `ai_summary_degraded_total{reason="post_check_blocked"}` +1。
# 文件 mtime 变化时自动热加载（无需重启服务）。
#
# 收录规则：
#   - 医学诊断 / 用药建议 / 病情判断这类越权表述（医师法红线）
#   - 紧急程度判断（"立即就医" 这类我们不该让 LLM 直接拍）
#   - 价格 / 退款 / 投诉这类敏感业务措辞
#
# 不收录：
#   - "建议休息" "注意保暖" 等通用关怀语（边界 case, 单测必须覆盖不误判）
#   - 医院/科室名称（地理事实）
#
# 维护：词典由产品 + 法务双签，PR 必走 Code Review。

phrases:
  # —— 医师法越权 ——
  - "确诊"
  - "诊断为"
  - "建议用药"
  - "建议服用"
  - "建议手术"
  - "可以停药"
  - "不需要再就诊"
  # —— 紧急程度越权 ——
  - "立即就医"
  - "病情危急"
  - "生命危险"
  # —— 业务敏感 ——
  - "保证退款"
  - "承诺赔偿"
  - "百分之百"
