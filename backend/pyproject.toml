[project]
name = "yiluan-backend"
version = "0.1.0"
description = "YiLuAn - Medical Companion Service Backend"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not smoke and not docker and not azurite'"
markers = [
    "smoke: slow smoke tests requiring a real Postgres (run with `pytest -m smoke`)",
    "e2e: end-to-end backend API tests requiring real Postgres+Redis (run with `pytest -m e2e`)",
    "docker: docker compose --scale based multi-replica tests, manual staging only (run with `pytest -m docker`)",
    "azurite: AzureBlobStorageBackend real-SDK integration tests against a local azurite emulator (run with `pytest -m azurite`; needs azurite container on :10000). S2-DEV-016-PHASE-B-PREFLIGHT-SDK.",
    "money_safety: resilient contract tests for money flow (PSP callback / refund / wallet ledger / reconciliation). Release gate (S2-TEST-001 / PRD-001 §6.B / ADR-0026r1).",
    "share_security: negative & abuse tests for Top1 family share authorization (PRD-001 §6.B 8-条 negative + OTP 频控/爆破/复用). Release gate (S2-TEST-002 / ADR-0036 §3.5).",
]

[tool.coverage.run]
# Use Python 3.12 sys.monitoring tracer; the legacy C tracer mis-attributes
# coverage in async generator / try/except blocks (~4% under-report).
core = "sysmon"
branch = false
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# import-linter contracts (ADR-0032 / D-044 Q2)
#
# Run locally with::
#
#     pip install import-linter
#     lint-imports --config backend/pyproject.toml
#
# CI is the source of truth (see .github/workflows). M2 PR ships the
# contract; CI gating is added in a follow-up ops chore.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "wallet domain must not import payment domain"
type = "forbidden"
source_modules = ["app.services.wallet"]
forbidden_modules = ["app.services.payment", "app.services.providers.payment"]
# Why: wallet_ledger is the append-only book of record (ADR-0032 §3.5).
# It is fed by payment events one-way; allowing the reverse import would
# couple ledger writes to payment service internals and break the M3
# replay/compensation contract.

