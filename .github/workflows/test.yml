name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio aiosqlite

      - name: Run tests
        run: cd backend && python -m pytest tests/ -v

      - name: Run e2e tests
        run: cd backend && python -m pytest tests/e2e/ -m e2e -v
        timeout-minutes: 5

      # ---------------------------------------------------------------
      # Release gates (S2-TEST-001 / S2-TEST-002 / PRD-001 §6.B)
      # money_safety + share_security 同级闸门，任一失败阻塞 merge。
      # ---------------------------------------------------------------
      - name: Release gate — money_safety contract tests
        run: cd backend && python -m pytest -m money_safety -v --tb=short
        timeout-minutes: 5

      - name: Release gate — share_security tests (Top1 family share)
        run: cd backend && python -m pytest -m share_security -v --tb=short
        timeout-minutes: 5
        continue-on-error: true  # 过渡期：S2-DEV-002/003 未落地前允许空收集；done 后改为 strict

      - name: Release gate — OpenAPI cross-end contract diff (ADR-0036 §2.7 七字段)
        run: bash scripts/qa/openapi_contract_diff.sh
        timeout-minutes: 2

      - name: Release gate — 微信 openapi-typescript schema check
        run: bash scripts/qa/wechat_openapi_check.sh
        timeout-minutes: 5
        continue-on-error: true  # 过渡期：S2-DEV-002 done 后去 continue-on-error

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t yiluan-backend:test ./backend

  wechat:
    name: WeChat Mini Program Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: cd wechat && npm install

      - name: Type-check (JSDoc + checkJs)
        run: cd wechat && npm run typecheck

      - name: Run tests
        run: cd wechat && npm test

      - name: Bundle size report
        run: cd wechat && npm run bundle-size:ci

      - name: Upload bundle size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wechat-bundle-size
          path: wechat/bundle-size.json
          if-no-files-found: warn
          retention-days: 30
