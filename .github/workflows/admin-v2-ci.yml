# =============================================================================
# admin-v2 CI (S2-DEV-013 / ADR-0042 Phase 1)
# -----------------------------------------------------------------------------
# Path-filter gate 模式（参考 S2-OPS-008 iOS CI / S2-OPS-004 backend）：
#   - changes job 永远跑，输出 admin_v2=true/false
#   - build-test 用 if 判定真跑还是 skip（skip 算 required success）
#
# 验证项：
#   1. tsc --noEmit 类型检查
#   2. vitest run 单测（≥ 8 case）
#   3. vite build 产物 + bundle gzip < 2MB budget gate
#   4. API path consistency (vite proxy / basename / apiClient baseURL 一致)
# =============================================================================

name: admin-v2 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: admin-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect admin-v2 changes
    runs-on: ubuntu-latest
    outputs:
      admin_v2: ${{ steps.filter.outputs.admin_v2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.pull_request.base.ref || github.ref_name }}
          filters: |
            admin_v2:
              - 'admin-v2/**'
              - '.github/workflows/admin-v2-ci.yml'

  build-test:
    name: Build & Test (admin-v2)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.admin_v2 == 'true' }}
    defaults:
      run:
        working-directory: admin-v2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 不预 cache lockfile（当前没 commit package-lock.json、本机无 npm 环境）
          # CI 走 npm install 在首次生成 lockfile、后续 PR-B 补合后可恢复 cache + npm ci

      - name: Install
        run: npm install --no-audit --no-fund

      - name: API path consistency gate
        run: node scripts/check-api-path-consistency.mjs

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build (vite)
        run: npm run build

      - name: Bundle size budget gate (dist gzip < 2MB)
        run: node scripts/check-bundle-size.mjs

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: admin-v2-dist-${{ github.run_id }}
          path: admin-v2/dist
          retention-days: 7
