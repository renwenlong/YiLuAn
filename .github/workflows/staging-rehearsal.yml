# Weekly staging rehearsal (D-044)
#
# Runs the full mock-provider patient-journey replay every Wednesday
# 14:00 GMT+8.  Requires a self-hosted runner with Docker available
# because the stack binds to 127.0.0.1:18080.
#
# ENABLEMENT (ADR-0059 方案 B, self-hosted runner):
#   This workflow is gated on the repo variable `STAGING_RUNNER_READY`.
#   It stays inert until a self-hosted runner labelled `staging-mock` is
#   registered AND `STAGING_RUNNER_READY` is set to 'true' (no workflow
#   edit needed to flip it on/off — just set/unset the repo variable).
#   See docs/STAGING_RUNNER_SETUP.md for the runner registration + enable
#   steps.  Until then the rehearsal is performed manually per
#   docs/STAGING_REHEARSAL_RUNBOOK.md (fallback, unchanged — AC#3).
name: staging-rehearsal

on:
  workflow_dispatch: {}
  # Safe to keep scheduled before runner activation: the job-level variable
  # gate below evaluates before runner assignment, so an unconfigured repo
  # records a skipped run instead of queueing forever on a missing runner.
  schedule:
    - cron: '0 6 * * 3'   # Wednesday 14:00 GMT+8

jobs:
  rehearsal:
    # Enabled only when a self-hosted runner is registered and the repo
    # variable STAGING_RUNNER_READY == 'true'.  Flip via repo variable,
    # not by editing this file (ADR-0059 §6.5 / docs/STAGING_RUNNER_SETUP.md).
    if: ${{ vars.STAGING_RUNNER_READY == 'true' }}
    runs-on: [self-hosted, staging-mock]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ADR-0059 §5.5 — pre-deploy CI gate.  Refuse to bring up staging on
      # a commit whose REQUIRED checks are not all green (prevents a
      # red/pending commit from polluting 刻晴's QA environment).
      - name: CI gate (required checks green)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deploy/staging/check-main-ci.sh --sha "$(git rev-parse HEAD)"

      - name: Bring up staging stack
        working-directory: deploy
        shell: bash
        run: ./up.sh

      - name: Publish staging metadata
        shell: bash
        run: |
          {
            echo "## Staging rehearsal deployment"
            echo
            echo "- URL: http://127.0.0.1:18080 (runner-local)"
            echo "- Version: \`${GITHUB_SHA}\`"
            echo "- Deployed at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run weekly rehearsal
        shell: bash
        run: |
          python -X utf8 deploy/staging/replay/run-weekly-rehearsal.py --skip-seed

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-report
          path: deploy/staging/reports/

      - name: Tear down stack
        if: always()
        working-directory: deploy
        shell: bash
        run: ./down.sh
