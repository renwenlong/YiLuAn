# S3-OPS-STARTUP-PROBE-FRAMEWORK AC#8 反案 #25 哨兵
# 反案哨兵: 禁止 backend/app/ 内 inline env check pattern 复活 — 必走
# @register_startup_probe 统一框架 (PR #306 落).
#
# Refs:
#   - 反案 #25 (ADR-0051 r3 §2.3): 协议层禁止散点 env check
#   - PR #306 (S3-OPS-STARTUP-PROBE-FRAMEWORK PR1): 框架 land
#   - 本 workflow = PR2 lint 哨兵 (AC#8 + AC#9 拆分)
name: No Inline Env Check Lint (startup probe framework sentinel)

on:
  pull_request:
    paths:
      - 'backend/app/**'
      - 'backend/scripts/qa/check_no_inline_env_check.py'
      - 'backend/tests/qa/test_check_no_inline_env_check.py'
      - '.github/workflows/no-inline-env-check.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/app/**'
      - 'backend/scripts/qa/check_no_inline_env_check.py'

jobs:
  no-inline-env-check-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lint — 禁 backend/app/ 内 inline env check 散点
        run: python backend/scripts/qa/check_no_inline_env_check.py
