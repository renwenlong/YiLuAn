{{/*
Application Secret — 仅当 .Values.secrets.existingSecret 未指定时由 Chart 渲染创建。
生产环境强烈推荐使用 existingSecret 指向通过 `kubectl create secret generic` 或外部
Secret 管理（External Secrets Operator / Vault / SealedSecrets / Aliyun KMS）创建的
Secret，**禁止**把真实凭证直接写入 values.yaml。

预期 keys（被 api-deployment / recon-cron-deployment 通过 envFrom.secretRef 引入为环境变量）：
  - JWT_SECRET_KEY
  - DATABASE_URL                     (含 password；或拆分成 DATABASE_PASSWORD)
  - REDIS_URL                        (含 password；或拆分成 REDIS_PASSWORD)
  - WECHAT_PAY_APIV3_KEY
  - WECHAT_PAY_PRIVATE_KEY
  - WECHAT_PAY_MCH_ID
  - WECHAT_PAY_SERIAL_NO
  - ALIYUN_SMS_ACCESS_KEY_ID
  - ALIYUN_SMS_ACCESS_KEY_SECRET
*/}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yiluan.fullname" . }}-secret
  labels:
    {{- include "yiluan.labels" . | nindent 4 }}
type: Opaque
{{- with .Values.secrets.data }}
stringData:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
