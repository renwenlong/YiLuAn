# =============================================================================
# YiLuAn Helm Chart — values.production.yaml
#
# Production 环境 overrides。安装：
#   helm upgrade --install yiluan ./infra/helm/yiluan \
#     -f infra/helm/yiluan/values.production.yaml \
#     -n yiluan-prod --create-namespace
#
# ⚠️ 生产严禁把任何凭证写入本文件。所有敏感字段必须通过 existingSecret 引入：
#   kubectl -n yiluan-prod create secret generic yiluan-prod-secrets \
#     --from-literal=JWT_SECRET_KEY=... ...
# 推荐配合 External Secrets Operator + Aliyun KMS / Vault / SealedSecrets。
# =============================================================================

api:
  replicaCount: 3
  image:
    repository: registry.cn-beijing.aliyuncs.com/yiluan/api  # TODO: 替换为正式 ACR repo
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"

recon:
  enabled: true
  replicaCount: 2
  image:
    repository: registry.cn-beijing.aliyuncs.com/yiluan/recon  # TODO: 替换为正式 ACR repo
    tag: ""
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

postgres:
  enabled: true
  primary:
    replicaCount: 1
  replica:
    replicaCount: 2
  persistence:
    enabled: true
    size: 200Gi
    storageClass: alicloud-disk-essd  # TODO: 确认 storageClass 名称
  auth:
    existingSecret: yiluan-prod-postgres-secret  # TODO: 创建该 secret
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

redis:
  enabled: true
  replicaCount: 3
  auth:
    existingSecret: yiluan-prod-redis-secret  # TODO: 创建该 secret

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: api.yiluan.example.com  # TODO: 替换为正式域名
  tls:
    enabled: true
    secretName: yiluan-prod-tls

config:
  data:
    ENV: "production"
    LOG_LEVEL: "info"
    RECON_SCHEDULE_CRON: "*/15 * * * *"
    PRIVACY_CLEANUP_CRON: "0 3 * * *"
    METRICS_ENABLED: "true"
    TRACING_ENABLED: "true"
  app:
    name: yiluan
    env: production

# -----------------------------------------------------------------------------
# Secrets — 生产环境必须使用 existingSecret，禁止使用 .secrets.data
# TODO: 部署前先创建 yiluan-prod-secrets：
#   kubectl -n yiluan-prod create secret generic yiluan-prod-secrets \
#     --from-literal=JWT_SECRET_KEY=... \
#     --from-literal=DATABASE_URL=... \
#     --from-literal=REDIS_URL=... \
#     --from-literal=WECHAT_PAY_APIV3_KEY=... \
#     --from-file=WECHAT_PAY_PRIVATE_KEY=./apiclient_key.pem \
#     --from-literal=WECHAT_PAY_MCH_ID=... \
#     --from-literal=WECHAT_PAY_SERIAL_NO=... \
#     --from-literal=ALIYUN_SMS_ACCESS_KEY_ID=... \
#     --from-literal=ALIYUN_SMS_ACCESS_KEY_SECRET=...
# -----------------------------------------------------------------------------
secrets:
  existingSecret: yiluan-prod-secrets  # TODO: 上线前确认该 Secret 已通过 KMS/ESO 注入
  # data 段在 existingSecret 非空时不会被渲染，保留为空作为提醒
  data: {}

# -----------------------------------------------------------------------------
# HPA — production 默认开启
# -----------------------------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
